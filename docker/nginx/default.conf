resolver 127.0.0.11 valid=10s;
resolver_timeout 5s;

server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;
    root /var/www/public;
    index index.php;

    # Timeouts: balanced between long uploads and connection pruning
    keepalive_timeout 65;
    client_body_timeout 60;
    client_header_timeout 60;
    send_timeout 60;

    # Network efficiency
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;

    # FastCGI buffers: sized for typical Laravel responses (~100-200KB)
    fastcgi_buffers 16 16K;
    fastcgi_buffer_size 32K;
    fastcgi_busy_buffers_size 128K;
    fastcgi_read_timeout 300s;
    fastcgi_connect_timeout 60s;
    fastcgi_send_timeout 300s;
    fastcgi_keep_conn on;

    # Gzip: compress text, JSON, JavaScript (reduces bandwidth 60-80%)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        application/x-font-ttf
        application/x-font-opentype
        image/svg+xml
        image/x-icon;

    # Cache static assets aggressively (1-year expiry with immutable flag)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|pdf|mp4|webm|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Pragma "public";
        access_log off;
        log_not_found off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Shop directory
    # location /shop/ {
    #     alias /var/www/public/shop/;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    #     access_log off;
    #     try_files $uri $uri/ /index.php?$query_string;
    # }

    # App storage: user uploads (keep short cache for updates)
    location /storage/ {
        alias /var/www/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Vendor libraries (long cache)
    location /vendor/ {
        alias /var/www/public/vendor/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Vite dev server proxy: optional, fails gracefully if offline
    # Only active when running: rebuild.bat dev (docker compose --profile dev up)
    # Uses variable to delay resolution until request time (lazy resolution)
    set $vite_upstream http://vite:5173;
    location ~ ^/@(query|vite|id|react-refresh) {
        proxy_pass $vite_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # If vite is offline, fall back to PHP (production mode)
        error_page 502 503 =200 /index.php?$query_string;
    }
    
    # Vite HMR WebSocket (for hot-reload)
    location /ws {
        proxy_pass $vite_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        error_page 502 503 =200 /index.php?$query_string;
    }

    # PHP requests (main app logic)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param SERVER_ADDR $server_addr;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param SERVER_SOFTWARE nginx;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param HTTPS $https;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Default route
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM status (monitoring only, not exposed externally)
    location /fpm-status {
        access_log off;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logging: buffered writes reduce I/O overhead
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log combined buffer=64K flush=10s;
}
