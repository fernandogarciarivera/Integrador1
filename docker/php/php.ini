; PHP 8.4 optimization for Laravel development
memory_limit=512M
max_execution_time=300
upload_max_filesize=100M
post_max_size=100M
date.timezone=UTC
display_errors=On
display_startup_errors=On
log_errors=On
error_log=/var/log/php_errors.log
default_socket_timeout=60
connect_timeout=10

; Realpath cache (aggressively caches file stat calls)
realpath_cache_size=8192K
realpath_cache_ttl=3600

; OPCache: AGGRESSIVE caching for dev (XDebug rebuilds on changes anyway)
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.revalidate_freq=3600
opcache.fast_shutdown=1
opcache.validate_timestamps=1
opcache.validate_permission=0
opcache.revalidate_path=0
opcache.consistency_checks=0
opcache.opt_debug_level=0
opcache.save_comments=1
opcache.enable_file_override=1
opcache.file_cache=/tmp/opcache

; XDebug: DISABLED by default (only activate when debugging)
; Use: curl -H "XDEBUG_TRIGGER=1" http://localhost:8282
;xdebug.mode=off
xdebug.mode=debug,develop,profile
xdebug.start_with_request=yes
xdebug.trigger_value=vscode
xdebug.idekey=vscode
xdebug.discover_client_host=0
xdebug.client_host=host.docker.internal
xdebug.client_port=9004
xdebug.log=/tmp/xdebug.log
xdebug.log_level=10
xdebug.profiler_enable=0
xdebug.profiler_enable_trigger=0
xdebug.file_link_format=vscode://file/{file}:{line}
xdebug.start_upon_error=default
xdebug.halt_level=E_WARNING