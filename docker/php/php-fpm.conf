[global]
pid = /run/php-fpm.pid
error_log = /proc/self/fd/2

[www]
listen = 9000
;listen.allowed_clients = any
user = www-data
group = www-data
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
catch_workers_output = yes
clear_env = no
env[XDEBUG_MODE] = debug
env[XDEBUG_TRIGGER] = vscode