[www]
; PHP-FPM optimized for concurrent requests with memory efficiency

user = www-data
group = www-data

; Process manager: dynamic (scales with load)
pm = dynamic
pm.max_children = 15
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_spawn_rate = 5
pm.process_idle_timeout = 15s

; Limit memory leaks: recycle workers after N requests
pm.max_requests = 1000

; Listen socket
listen = 9000
listen.backlog = 511
listen.owner = www-data
listen.group = www-data

; Timeouts (prevent zombie processes)
request_terminate_timeout = 300s
request_slowlog_timeout = 10s

; Logging (write to stdout/stderr for Docker)
access.log = /proc/self/fd/2
slowlog = /proc/self/fd/2

; Status endpoint (for monitoring)
pm.status_path = /status
ping.path = /ping
ping.response = pong

; Environment passthrough
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

; File descriptor limits
rlimit_files = 65535
rlimit_core = unlimited
